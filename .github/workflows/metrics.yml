name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # The 3D isometric contribution calendar (the one from the inspo)
      # ------------------------------------------------------------------ #
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Yash-Gavas
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------ #
      # Coding habits: commits per hour of day, per weekday, language activity
      # ------------------------------------------------------------------ #
      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Yash-Gavas
          filename: assets/metrics.habits.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted, recent-activity weighted)
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Yash-Gavas
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

      # ------------------------------------------------------------------ #
      # GitHub achievements only (Pull Shark, YOLO, ...). LeetCode and
      # HackerRank badges come from scripts/cards.py below.
      # ------------------------------------------------------------------ #
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Yash-Gavas
          filename: assets/metrics.achievements.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

      # ------------------------------------------------------------------ #
      # Stat card, coding-badges card (LeetCode + HackerRank), repo cards
      # ------------------------------------------------------------------ #
      - name: Stat, coding and repo cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 scripts/cards.py \
            --user Yash-Gavas \
            --leetcode YashGavas \
            --hackerrank yash_s_gavas \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.*.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh metrics"
          git push
